backend:
  name: github
  repo: esraadesigner592-cmyk/Esraa-Designer
  branch: main

media_folder: "assets"
public_folder: "/assets"

locale: "ar"

collections:
  - name: "products"
    label: "المنتجات"
    folder: "content/products"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "اسم المنتج", name: "title", widget: "string" }
      - { label: "الوصف", name: "description", widget: "text", required: false }
      - { label: "الصورة", name: "image", widget: "image" }
      - { label: "السعر", name: "price", widget: "string", required: false }
      - { label: "التصنيف", name: "category", widget: "string", required: false }
